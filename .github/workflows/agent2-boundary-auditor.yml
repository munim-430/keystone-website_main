name: "Agent 2: Adversarial Boundary Auditor"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [ agent-audit, trigger-boundary-check ]

jobs:
  adversarial_audit:
    name: "Boundary & Invariant Stress Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Agent 2 Adversarial Stress Test
        run: node scripts/agent2_adversarial_auditor.cjs
